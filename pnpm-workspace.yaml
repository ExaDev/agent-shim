allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@exadev/eslint-config@2.12.1'

# @semantic-release/release-notes-generator pins conventional-changelog-writer to
# ^8.0.0, which predates the breaking Handlebars-to-render-function template rewrite that conventional-changelog-conventionalcommits@10.x now requires -- without this override, generateNotes silently produces an empty changelog body (just the version header, no Features/Bug Fixes sections). Confirmed upstream: https://github.com/semantic-release/release-notes-generator/issues/992
overrides:
  conventional-changelog-writer: ^9.2.0
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  # Transitive copies below the patched release of an audit advisory (GHSA-rxp7-6hxx-x8q5 ip-address, GHSA-xjj6-f33q-929c undici 6.x, GHSA-w74x-v6f9-j3xg fast-uri, GHSA-27r3-jxmh-p828 body-parser, GHSA-6pq8-jhm2-2vcw qs) that the MCP SDK and the semantic-release chain still range over. Remove each entry once the parent packages' ranges admit the patched version.
  ip-address: ^10.7.4
  fast-uri: ^3.1.9
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  qs@>=6.7.0 <6.16.1: 6.16.1
  undici@>=6.0.0 <6.29.1: 6.29.1

# braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm, stack exhaustion on deeply nested patterns) has no patched release, and it is reachable only through the dev-only semantic-release chain (micromatch), never at runtime. Remove this entry once braces, micromatch or semantic-release ships a fix; tracked in https://github.com/ExaDev/agent-shim/issues/92
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

saveExact: true
