name: Tap and install the Homebrew formula
description: Taps ExaDev/agent-shim and installs the formula with brew's output kept off the runner's stdout pipe. A brew that dies of a broken pipe is tolerated only on the signatures the failing runs showed, and every path ends in the check that the formula is installed at the released version and the installed binary reports it. The calling job sets RELEASE_TAG, the released tag (vX.Y.Z), as its other verification steps read it.

runs:
  using: composite
  steps:
    - shell: bash
      run: ${{ github.action_path }}/install.sh ExaDev/agent-shim ExaDev/agent-shim/agent-shim
