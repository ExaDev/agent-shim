            echo "error: 'claude' should be gone after shim disable -- found $(command -v claude)"
            exit 1
          fi

  # macOS x64's SEA binary segfaults on every invocation (a known, unfixed upstream Node bug -- see docs/release-process.md's "Build (Node SEA)" section) so install.sh gives that one architecture a genuinely different path: npm install into a scratch prefix, then copy the resulting bin script into place, matching the Homebrew formula's own workaround. needs publish-npm (not just release) since it installs whatever npm currently resolves as @latest for the agent-shim package -- running before that publish completes would install a stale, previously-published version and fail the tag-match check below for an unrelated reason.
