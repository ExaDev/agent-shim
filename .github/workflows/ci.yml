name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref -- but only for pull_request events. A push-to-main run can tag and push a real release partway through (semantic-release), then spend several more minutes on builds, npm publish, GitHub Release creation, and tap updates; cancelling that mid-flight because a second push landed (e.g. a Dependabot auto-merge racing a manual push) leaves a real git tag with none of its actual artifacts ever published -- confirmed in production 2026-08-03, v0.3.4 tagged with every downstream job killed seconds after Semantic Release succeeded. A pull_request's stale checks have no such cost, so those still get superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-and-run
        with:
          task: lint
          command: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-and-run
        with:
          task: typecheck
          command: pnpm typecheck

      # Regenerates schema/*.schema.json from src/config/schema.ts and fails if the committed files don't match byte-for-byte — the committed schemas are published artifacts, so they must never silently drift from the Zod schemas that define them. Lives here rather than its own job since it needs the same TS toolchain typecheck already set up, but it isn't a caching concern in its own right.
      - run: pnpm schema
      - run: git diff --exit-code schema/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-and-run
        with:
          task: test
          command: pnpm test:coverage

      - name: Post coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const cov = require('./coverage/coverage-summary.json');
              const t = cov.total;
              const pct = (k) => t[k].pct.toFixed(1) + '%';
              const row = (label, k) => '| ' + label + ' | ' + pct(k) + ' |';
              console.log('## Coverage');
              console.log('');
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log(row('Lines', 'lines'));
              console.log(row('Statements', 'statements'));
              console.log(row('Functions', 'functions'));
              console.log(row('Branches', 'branches'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Blocks release on any moderate+ severity vulnerability in the dependency tree — the live advisory database changes independently of source content, so this is never turbo-wrapped/cached (see turbo.json).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-and-run
        with:
          task: audit
          command: pnpm audit --audit-level moderate

  # Unused-file/export/dependency detection, scoped to a single-package CLI (not exadex's Next.js monorepo shape) — src/cli.ts is the only declared entry; every resolve/* submodule is imported directly by its own consumers now (no facade), and everything else knip flags as unused is either genuinely dead or a same-file-only export that should never have carried the `export` keyword in the first place.
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-and-run
        with:
          task: knip
          command: pnpm knip

  # Runs on every push to main, after the checks above pass. Determines whether the commits since the last tag warrant a new release by Conventional Commits type (see release.config.ts: feat -> minor, fix/perf -> patch, a BREAKING CHANGE footer -> major), and if so, creates and pushes the next vX.Y.Z tag itself -- exactly what used to be a manual `git tag`/`git push` step earlier in this project's life. Deliberately configured to do ONLY version-decision + tagging + changelog generation: @semantic-release/npm runs with npmPublish: false (so it still bumps package.json's version and commits it, but never touches the npm registry), and @semantic-release/github is not loaded at all -- actual npm publishing (OIDC trusted publishing), GitHub Release creation, and the Homebrew/Scoop tap updates all remain this project's own jobs below. Stays bespoke rather than using the setup-and-run composite action: it needs fetch-depth: 0, a GH_TOKEN env var (not the composite action's GITHUB_TOKEN name), and permissions: contents: write, none of which fit the generic single-command shape.
  #
  # The build/publish/verify pipeline below is deliberately NOT a separate tag-triggered workflow run -- a GITHUB_TOKEN-authenticated push never triggers a new run (GitHub's anti-recursion restriction), and that held even for an SSH deploy key registered on this repo, so a tag pushed from here would never have fired a second run anyway. Instead, every downstream job runs later in this SAME run (like this org's other semantic-release repos, e.g. graphle, already do) and gates on `needs.semantic-release.outputs.published`. Unlike graphle's own downstream job, which just redeploys unconditionally on every push to main (an idempotent rebuild, so it never needs to ask "did a release happen"), building five platform binaries, publishing to npm, and updating two external tap repos are NOT safe to run unconditionally -- a no-release push would waste the builds at best and fail the npm publish/tap updates outright at worst (no new tag for them to reference). That "was anything actually tagged" check needs no plugin: after semantic-release runs, `git describe --exact-match --tags HEAD` succeeds only when the just-run HEAD commit is itself tagged.
  semantic-release:
    name: Semantic Release
    if: github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, audit, knip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.check-tag.outputs.published }}
      version: ${{ steps.check-tag.outputs.version }}
      tag: ${{ steps.check-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: check-tag
        name: Check whether semantic-release just tagged a release
        run: |
          if tag=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            {
              echo "published=true"
              echo "tag=$tag"
              echo "version=${tag#v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  # The six build jobs below (build-arm64 through build-windows-arm64) run on every PR too, not just a published release, and each has its own dedicated smoke-test-* job further down that downloads the artifact and directly executes it -- kept as a separate job rather than a step inside the build job so a smoke-test failure shows as its own line in the PR checks list, distinct from "did it build." This is what catches an architecture-specific regression (a bad esbuild target, a cache collision serving another architecture's binary -- confirmed to actually happen once, see setup-and-run/action.yml's own comment) before merge rather than after a real release ships a broken binary. On a PR, each job checks out the PR's own head commit; on a push to main, `ref: main` picks up the post-release HEAD semantic-release just pushed (see the semantic-release job's own comment above for why that's a separate commit from the one that triggered this run). Publishing -- npm, GitHub Packages, the GitHub Release itself, and the Homebrew/Scoop tap updates -- stays gated on `needs.semantic-release.outputs.published == 'true'` alone and never runs on a PR, since those all have real, one-way side effects a PR must never trigger.

  # macOS arm64 is the only target Node core itself tests and verifies `--build-sea` against upstream. This job's binary is the one this project actually stands behind. Runs on GitHub's standard hosted `macos-latest` (Apple Silicon by default) -- this repo is public, so standard hosted runners are free and unmetered on every plan, and GitHub manages the rolling image migration this label implies, so there's no version-pinned image for this project to keep bumping as older ones deprecate.
  build-arm64:
    name: Build (macOS arm64, verified)
    if: always() && (github.event_name == 'pull_request' || needs.semantic-release.outputs.published == 'true')
    needs: [semantic-release]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: ./.github/actions/setup-and-run
        with:
          task: build
          command: pnpm build

      - run: mv dist/agent-shim-sea dist/agent-shim-macos-arm64
      - run: shasum -a 256 dist/agent-shim-macos-arm64 | awk '{print $1}' > dist/agent-shim-macos-arm64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: agent-shim-macos-arm64
          path: |
            dist/agent-shim-macos-arm64
            dist/agent-shim-macos-arm64.sha256
          retention-days: 7

  # x64 is explicitly NOT part of Node core's own SEA test matrix (confirmed against current Node.js docs — see scripts/build.mts's own header comment). This job attempts the same build on an Intel runner as a best-effort convenience for x64 users, but nothing here proves the resulting binary is supported or even fully functional upstream — only that the build command itself completed; the dedicated smoke-test-macos-x64-best-effort job further down runs `|| true` and does NOT prove the binary actually runs. It is published labelled as unverified, and this job is allowed to fail without blocking the release below. Runs on GitHub's standard hosted `macos-15-intel` -- free for this public repo like every other standard runner, and GitHub's own supported x64 macOS label through August 2027, after which x86_64 support ends entirely on GitHub Actions.
  #
  # Confirmed as of v0.2.7/v0.2.8: this binary segfaults on every invocation, including --version and --help -- the smoke-test-macos-x64-best-effort job has been silently swallowing this exact crash via `|| true` on every prior release; verify-tap-macos-x64/verify-install-script-macos-x64 (continue-on-error, further down this file) are what actually caught it. Reproduced locally under Rosetta with a real lldb backtrace (EXC_BAD_ACCESS in __cxx_global_var_init during dyld's static-initializer pass, before main() runs) and isolated to Node's own --build-sea via a trivial one-line script crashing identically -- not this project's bundle, build script, or code. This is a known, unfixed upstream limitation: nodejs/node#62893 reproduces the identical crash and was closed doc-only (nodejs/node#63181); the deeper thread nodejs/node#59553 floats an unconfirmed theory (postject's LIEF-based Mach-O injection corrupting the binary so dyld misreads a segment as oversized TLS) but closed stale, with a Node core maintainer stating it's "unlikely that anyone would invest time in fixing it for macOS" given x64 macOS's Tier 2 deprioritisation. No workaround is available in this project's control (no alternate codesign invocation, sea-config.json option, or Node flag) -- see docs/release-process.md's "Build (Node SEA)" section for the full writeup.
  build-x64-best-effort:
    name: Build (macOS x64, best-effort, unverified)
    if: always() && (github.event_name == 'pull_request' || needs.semantic-release.outputs.published == 'true')
    needs: [semantic-release]
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: ./.github/actions/setup-and-run
        with:
          task: build
          command: pnpm build

      - run: mv dist/agent-shim-sea dist/agent-shim-macos-x64-unverified
      - run: shasum -a 256 dist/agent-shim-macos-x64-unverified | awk '{print $1}' > dist/agent-shim-macos-x64-unverified.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: agent-shim-macos-x64-unverified
          path: |
            dist/agent-shim-macos-x64-unverified
            dist/agent-shim-macos-x64-unverified.sha256
          retention-days: 7

  # Linux is tested by Node core against every distribution it supports except Alpine, and every architecture except s390x — x64 and arm64 are both fully within that verified set, unlike macOS x64 above.
  build-linux-x64:
    name: Build (Linux x64, verified)
    if: always() && (github.event_name == 'pull_request' || needs.semantic-release.outputs.published == 'true')
    needs: [semantic-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: ./.github/actions/setup-and-run
        with:
          task: build
          command: pnpm build

      - run: mv dist/agent-shim-sea dist/agent-shim-linux-x64
      - run: shasum -a 256 dist/agent-shim-linux-x64 | awk '{print $1}' > dist/agent-shim-linux-x64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: agent-shim-linux-x64
          path: |
            dist/agent-shim-linux-x64
            dist/agent-shim-linux-x64.sha256
          retention-days: 7

  build-linux-arm64:
    name: Build (Linux arm64, verified)
    if: always() && (github.event_name == 'pull_request' || needs.semantic-release.outputs.published == 'true')
    needs: [semantic-release]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: ./.github/actions/setup-and-run
        with:
          task: build
          command: pnpm build

      - run: mv dist/agent-shim-sea dist/agent-shim-linux-arm64
      - run: shasum -a 256 dist/agent-shim-linux-arm64 | awk '{print $1}' > dist/agent-shim-linux-arm64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: agent-shim-linux-arm64
          path: |
            dist/agent-shim-linux-arm64
            dist/agent-shim-linux-arm64.sha256
          retention-days: 7

  # Node core documents full Windows support for --build-sea, unlike the macOS x64 caveat above.
  build-windows-x64:
    name: Build (Windows x64, verified)
    if: always() && (github.event_name == 'pull_request' || needs.semantic-release.outputs.published == 'true')
    needs: [semantic-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: ./.github/actions/setup-and-run
        with:
          task: build
          command: pnpm build

      - name: Package archive
        shell: pwsh
        run: |
          Copy-Item dist/agent-shim-sea.exe dist/agent-shim.exe
          Compress-Archive -Path dist/agent-shim.exe -DestinationPath dist/agent-shim-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/agent-shim-windows-x64.zip).Hash.ToLower()
          $hash | Out-File -Encoding ascii -NoNewline dist/agent-shim-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: agent-shim-windows-x64
          path: |
            dist/agent-shim-windows-x64.zip
            dist/agent-shim-windows-x64.zip.sha256
          retention-days: 7

  # Node's own SEA docs list Windows as regularly tested without the x64-only carve-out that explicitly excludes macOS x64 above -- Windows arm64 is a fully verified target from day one, not a best-effort one. windows-11-arm is GitHub's standard hosted Windows-on-Arm runner, generally available and free for this public repo like every other standard runner.
  build-windows-arm64:
    name: Build (Windows arm64, verified)
    if: always() && (github.event_name == 'pull_request' || needs.semantic-release.outputs.published == 'true')
    needs: [semantic-release]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}

      - uses: ./.github/actions/setup-and-run
        with:
          task: build
          command: pnpm build

      - name: Package archive
        shell: pwsh
        run: |
          Copy-Item dist/agent-shim-sea.exe dist/agent-shim.exe
          Compress-Archive -Path dist/agent-shim.exe -DestinationPath dist/agent-shim-windows-arm64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/agent-shim-windows-arm64.zip).Hash.ToLower()
          $hash | Out-File -Encoding ascii -NoNewline dist/agent-shim-windows-arm64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: agent-shim-windows-arm64
          path: |
            dist/agent-shim-windows-arm64.zip
            dist/agent-shim-windows-arm64.zip.sha256
          retention-days: 7

  # The six smoke-test-* jobs below each download one platform's just-built artifact and directly execute it, on a runner of the same OS+architecture the binary was built for -- a binary built for one architecture cannot run on another, so each job's runs-on matches its own build-* job exactly. Kept as dedicated jobs rather than a step inside build-* so a smoke-test failure shows as its own line in the PR checks list, distinct from "did it build" -- gated purely on `needs.build-*.result == 'success'` (with `always()` so a skipped or failed build job correctly skips the smoke test too, rather than the same implicit-success()-on-needs gotcha the build jobs themselves hit, described above).
  smoke-test-macos-arm64:
    name: Smoke test (macOS arm64)
    if: always() && needs.build-arm64.result == 'success'
    needs: [build-arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-macos-arm64
          path: artifacts
      - run: chmod +x artifacts/agent-shim-macos-arm64
      - run: |
          artifacts/agent-shim-macos-arm64 --version
          artifacts/agent-shim-macos-arm64 --help >/dev/null

  smoke-test-macos-x64-best-effort:
    name: Smoke test (macOS x64, best-effort)
    if: always() && needs.build-x64-best-effort.result == 'success'
    needs: [build-x64-best-effort]
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-macos-x64-unverified
          path: artifacts
      - run: chmod +x artifacts/agent-shim-macos-x64-unverified
      - name: Smoke test (best-effort only — a pass here is not proof of upstream support)
        run: artifacts/agent-shim-macos-x64-unverified --help || true

  smoke-test-linux-x64:
    name: Smoke test (Linux x64)
    if: always() && needs.build-linux-x64.result == 'success'
    needs: [build-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-linux-x64
          path: artifacts
      - run: chmod +x artifacts/agent-shim-linux-x64
      - run: |
          artifacts/agent-shim-linux-x64 --version
          artifacts/agent-shim-linux-x64 --help >/dev/null

  smoke-test-linux-arm64:
    name: Smoke test (Linux arm64)
    if: always() && needs.build-linux-arm64.result == 'success'
    needs: [build-linux-arm64]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-linux-arm64
          path: artifacts
      - run: chmod +x artifacts/agent-shim-linux-arm64
      - run: |
          artifacts/agent-shim-linux-arm64 --version
          artifacts/agent-shim-linux-arm64 --help >/dev/null

  smoke-test-windows-x64:
    name: Smoke test (Windows x64)
    if: always() && needs.build-windows-x64.result == 'success'
    needs: [build-windows-x64]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-windows-x64
          path: artifacts
      - name: Extract and smoke test
        shell: pwsh
        run: |
          Expand-Archive -Path artifacts/agent-shim-windows-x64.zip -DestinationPath extracted
          & .\extracted\agent-shim.exe --version
          & .\extracted\agent-shim.exe --help | Out-Null

  smoke-test-windows-arm64:
    name: Smoke test (Windows arm64)
    if: always() && needs.build-windows-arm64.result == 'success'
    needs: [build-windows-arm64]
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-windows-arm64
          path: artifacts
      - name: Extract and smoke test
        shell: pwsh
        run: |
          Expand-Archive -Path artifacts/agent-shim-windows-arm64.zip -DestinationPath extracted
          & .\extracted\agent-shim.exe --version
          & .\extracted\agent-shim.exe --help | Out-Null

  # Publishes the plain esbuild bundle (not a SEA binary — the npm-installed package runs under whatever Node the installer already has) as the `agent-shim` npm package, so `npx agent-shim` and `npm install -g agent-shim` work alongside the GitHub Release binaries above. Uses npm's OIDC trusted publishing, the same pattern this org's other published packages use — no NPM_TOKEN secret. Trusted publishing itself is configured once, out of band, on the package's own npmjs.com settings page (linking this exact repo/workflow as an authorised publisher); nothing in this workflow can set that up. Stays bespoke rather than using the composite action: registry-url must stay unset (see below) and NODE_AUTH_TOKEN must be explicitly blanked, neither of which fits the generic shape.
  publish-npm:
    name: Publish npm package
    if: needs.semantic-release.outputs.published == 'true'
    runs-on: ubuntu-latest
    needs: [semantic-release, build-arm64]
    permissions:
      contents: read # declaring `permissions:` at all replaces every default, including the read access actions/checkout needs -- this isn't optional just because id-token is the "new" one being added
      id-token: write # OIDC identity for npm trusted publishing (no NPM_TOKEN)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          # registry-url is deliberately absent. Setting it makes setup-node write an .npmrc containing an _authToken line, and that line wins over the OIDC token exchange -- so the setting that looks like it configures the registry is exactly the one that would stop trusted publishing working.

      - run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC trusted publishing (needs npm CLI >=11.5.1)
        run: npm install -g npm@latest

      - run: pnpm build:bundle

      - run: npm publish
        env:
          # Blanked, not omitted -- an inherited NPM_TOKEN/NODE_AUTH_TOKEN would otherwise be used in preference to the OIDC exchange.
          NODE_AUTH_TOKEN: ""

  # Publishes the same build as an additional scoped alias, @exadev/agent-shim, to GitHub Packages -- so anyone with npm.pkg.github.com configured against this org can install without ever touching npmjs.com. A dedicated job, not folded into publish-npm above: GitHub Packages has no OIDC trusted-publishing exchange, and pnpm/npm attempt that exchange whenever id-token: write is granted regardless of which registry is actually being published to -- confirmed elsewhere in this org to fail with a 401 when a GitHub Packages leg shared a job holding that permission. This job deliberately never requests id-token: write and authenticates with a plain packages: write GITHUB_TOKEN instead.
  publish-github-packages:
    name: Publish alias to GitHub Packages
    if: needs.semantic-release.outputs.published == 'true'
    runs-on: ubuntu-latest
    needs: [semantic-release, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
          # Explicit, not inferred: setup-node's scope default only matches the scoped package.json name if package.json is already scoped by the time this step runs, and the rewrite below happens after it.
          scope: "@exadev"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:bundle

      - name: Rewrite package name and registry for the GitHub Packages scope
        # GitHub Packages requires the npm package name to be scoped to the repo owner. Rewriting the fields rather than maintaining a second package.json keeps this alias from drifting away from the real package's metadata. publishConfig.registry has to be overridden too: it takes precedence over the .npmrc registry-url set by setup-node above, so without it the publish would silently target registry.npmjs.org instead, which GITHUB_TOKEN can't authenticate against.
        run: |
          npm pkg set name="@exadev/agent-shim"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

      - run: npm publish --access public
        env:
          # GitHub Packages has no OIDC exchange to attempt, so this job (unlike publish-npm above) authenticates with a token -- GITHUB_TOKEN is sufficient and needs no separate secret.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stays bespoke rather than using the composite action: it needs the schema regen+stamp sequence and a multi-artifact download fan-in, neither of which fits a single generic command.
  release:
    name: Publish GitHub Release
    if: >
      needs.semantic-release.outputs.published == 'true' &&
      always() &&
      needs.build-arm64.result == 'success' &&
      needs.build-linux-x64.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.build-windows-x64.result == 'success' &&
      needs.build-windows-arm64.result == 'success' &&
      needs.smoke-test-macos-arm64.result == 'success' &&
      needs.smoke-test-linux-x64.result == 'success' &&
      needs.smoke-test-linux-arm64.result == 'success' &&
      needs.smoke-test-windows-x64.result == 'success' &&
      needs.smoke-test-windows-arm64.result == 'success'
    # smoke-test-macos-x64-best-effort is deliberately excluded, matching build-x64-best-effort's own continue-on-error: true above -- neither is allowed to block a release.
    needs:
      [
        semantic-release,
        build-arm64,
        build-x64-best-effort,
        build-linux-x64,
        build-linux-arm64,
        build-windows-x64,
        build-windows-arm64,
        smoke-test-macos-arm64,
        smoke-test-macos-x64-best-effort,
        smoke-test-linux-x64,
        smoke-test-linux-arm64,
        smoke-test-windows-x64,
        smoke-test-windows-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generate schema/*.schema.json fresh (it's already committed, but regenerating here keeps the release build honest — see the CI drift guard in the typecheck job above) then stamp $id to this tag's own version-pinned release URL. This is deliberately distinct from install.sh's unpinned releases/latest/download/... URL: a schema an editor references long-term must stay put at whatever version it was written against.
      - run: pnpm schema
      - run: node scripts/stamp-schema-ids.mts "${{ needs.semantic-release.outputs.tag }}"

      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-macos-arm64
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-macos-x64-unverified
          path: artifacts
        continue-on-error: true

      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-linux-x64
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-linux-arm64
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-windows-x64
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: agent-shim-windows-arm64
          path: artifacts

      - name: List release assets
        run: ls -la artifacts/ schema/

      - uses: softprops/action-gh-release@v3
        with:
          # Explicit, not inferred from github.ref -- this run was triggered by the push to main, not a tag push, so github.ref is refs/heads/main here.
          tag_name: ${{ needs.semantic-release.outputs.tag }}
          files: |
            artifacts/agent-shim-macos-arm64
            artifacts/agent-shim-macos-arm64.sha256
            artifacts/agent-shim-macos-x64-unverified
            artifacts/agent-shim-macos-x64-unverified.sha256
            artifacts/agent-shim-linux-x64
            artifacts/agent-shim-linux-x64.sha256
            artifacts/agent-shim-linux-arm64
            artifacts/agent-shim-linux-arm64.sha256
            artifacts/agent-shim-windows-x64.zip
            artifacts/agent-shim-windows-x64.zip.sha256
            artifacts/agent-shim-windows-arm64.zip
            artifacts/agent-shim-windows-arm64.zip.sha256
            install.sh
            schema/*.schema.json
          generate_release_notes: true
          body: |
            ## Platform support

            - **macOS arm64** (`agent-shim-macos-arm64`): verified. Node core tests and supports `--build-sea` on this target.
            - **macOS x64** (`agent-shim-macos-x64-unverified`): best-effort only. Node core does not test or verify single-executable-application support on x64 — this binary is provided for convenience, not as a supported target. If it's missing from this release, the best-effort build failed and was skipped rather than silently shipping a broken binary.
            - **Linux x64 / arm64** (`agent-shim-linux-x64`, `agent-shim-linux-arm64`): verified. Node core tests `--build-sea` on every Linux distribution it supports except Alpine, and every architecture except s390x.
            - **Windows x64 / arm64** (`agent-shim-windows-x64.zip`, `agent-shim-windows-arm64.zip`): verified. Node core documents Windows support for `--build-sea` without the x64-only carve-out that applies to macOS.
            - **npm** (`npx agent-shim` / `npm install -g agent-shim`): the plain bundle, not a SEA binary — runs under whatever Node (22.18 or later, or 24 and above) you already have.
            - **Homebrew** (`brew install ExaDev/agent-shim/agent-shim`) and **Scoop** (`scoop install agent-shim` after `scoop bucket add agent-shim https://github.com/ExaDev/scoop-agent-shim`) are updated automatically to this release by the jobs below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Regenerates ExaDev/homebrew-agent-shim's Formula/agent-shim.rb from this release's own published checksums. See that repo's README for the deploy-key setup this depends on.
  update-tap:
    name: Update Homebrew tap
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release, build-arm64, build-linux-x64, build-linux-arm64, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap via SSH deploy key
        uses: actions/checkout@v7
        with:
          repository: ExaDev/homebrew-agent-shim
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Download and validate checksums
        env:
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          TAG_URL="https://github.com/ExaDev/agent-shim/releases/download/${TAG}"
          VERSION="${TAG#v}"
          # --fail makes curl exit non-zero on 4xx/5xx so an error page's body never gets parsed as a checksum; --retry covers the small propagation window between the release job returning success and the asset being downloadable from the CDN. The regex validates what curl returned really is a 64-char lowercase hex digest before it goes anywhere near the generated formula.
          fetch_sha() {
            local name="$1" out="$2"
            curl -sL --fail --retry 6 --retry-delay 5 --retry-all-errors \
              "${TAG_URL}/${name}.sha256" | awk '{print $1}' > "${out}"
            if ! [[ "$(cat "${out}")" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::checksum for ${name} not a 64-char hex digest: $(cat "${out}")"
              exit 1
            fi
          }
          fetch_sha agent-shim-macos-arm64 sha-macos-arm64
          fetch_sha agent-shim-linux-x64 sha-linux-x64
          fetch_sha agent-shim-linux-arm64 sha-linux-arm64

          # macOS x64's SEA binary segfaults on every invocation (a known, unfixed upstream Node bug -- see docs/release-process.md's "Build (Node SEA)" section) so the formula installs via npm + a Homebrew-managed Node instead for that one architecture, same as this project's own npm channel. The npm registry has no published sidecar checksum, so this hashes the downloaded tarball itself. The retry budget here is wide (40 attempts, ~10 minutes) rather than matched to GitHub's own release CDN above: npm's package metadata and its tarball blob storage are separate backing stores, and the metadata can resolve a version -- `npm view`, a bare `npm install` -- well before the tarball itself is downloadable. Confirmed directly, not theoretical: this exact gap outlasted a 96-second budget once already, on a publish where the registry's own status page reported no incident and an unrelated, long-published package's tarball resolved instantly throughout.
          curl -sL --fail --retry 40 --retry-delay 15 --retry-all-errors \
            -o npm-package.tgz "https://registry.npmjs.org/agent-shim/-/agent-shim-${VERSION}.tgz"
          shasum -a 256 npm-package.tgz | awk '{print $1}' > sha-npm-tarball
          if ! [[ "$(cat sha-npm-tarball)" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::checksum for npm tarball not a 64-char hex digest: $(cat sha-npm-tarball)"
            exit 1
          fi

      - name: Generate formula
        env:
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          MACOS_ARM_SHA=$(cat sha-macos-arm64)
          NPM_TARBALL_SHA=$(cat sha-npm-tarball)
          LINUX_X64_SHA=$(cat sha-linux-x64)
          LINUX_ARM_SHA=$(cat sha-linux-arm64)
          mkdir -p Formula
          cat > Formula/agent-shim.rb <<EOF
          # Auto-generated by agent-shim's release workflow on every tagged release — do not edit manually.
          class AgentShim < Formula
            desc "Profile manager and launcher for Claude Code with per-directory sharing rules"
            homepage "https://github.com/ExaDev/agent-shim"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/ExaDev/agent-shim/releases/download/${TAG}/agent-shim-macos-arm64"
                sha256 "${MACOS_ARM_SHA}"
              end
              on_intel do
                # The SEA binary segfaults on every invocation on real x64 macOS hardware -- a known, unfixed upstream Node bug (see docs/release-process.md's "Build (Node SEA)" section for the full writeup and citations). Installs via npm + a Homebrew-managed Node instead, same code this project already publishes and verifies on the npm channel, on every other platform.
                url "https://registry.npmjs.org/agent-shim/-/agent-shim-${VERSION}.tgz"
                sha256 "${NPM_TARBALL_SHA}"
                depends_on "node"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/ExaDev/agent-shim/releases/download/${TAG}/agent-shim-linux-arm64"
                sha256 "${LINUX_ARM_SHA}"
              end
              on_intel do
                url "https://github.com/ExaDev/agent-shim/releases/download/${TAG}/agent-shim-linux-x64"
                sha256 "${LINUX_X64_SHA}"
              end
            end

            def install
              if OS.mac? && Hardware::CPU.intel?
                system "npm", "install", *std_npm_args
                bin.install_symlink libexec.glob("bin/*")
              else
                downloaded = Dir["agent-shim-*"].first
                bin.install downloaded => "agent-shim"
                chmod 0755, bin/"agent-shim"
                bin.install_symlink bin/"agent-shim" => "claude-use"
              end
            end

            def caveats
              <<~EOS
                agent-shim is installed alone -- nothing on this system claims the \`claude\` command by default.
                Run \`agent-shim run [args...]\` to use the launcher directly, or \`agent-shim shim enable\` once
                if you'd also like the shorter \`claude @<name>\` form (\`agent-shim shim disable\` undoes it).
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/agent-shim --version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The project was renamed from claude-use: formula_renames.json makes `brew upgrade` move an installed claude-use formula to agent-shim, and the old formula file is removed so it is not offered beside the new one.
          printf '{\n  "claude-use": "agent-shim"\n}\n' > formula_renames.json
          git rm -q --ignore-unmatch Formula/claude-use.rb
          git add Formula/agent-shim.rb formula_renames.json
          git diff --cached --quiet || git commit -m "chore: update formula to ${{ needs.semantic-release.outputs.tag }}"
          git push

  # Regenerates ExaDev/scoop-agent-shim's bucket/agent-shim.json from this release's own published checksum. See that repo's README for the deploy-key setup this depends on.
  update-scoop:
    name: Update Scoop bucket
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bucket via SSH deploy key
        uses: actions/checkout@v7
        with:
          repository: ExaDev/scoop-agent-shim
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}

      - name: Download and validate checksums
        env:
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          TAG_URL="https://github.com/ExaDev/agent-shim/releases/download/${TAG}"
          curl -sL --fail --retry 6 --retry-delay 5 --retry-all-errors \
            "${TAG_URL}/agent-shim-windows-x64.zip.sha256" | awk '{print $1}' > sha-windows-x64
          if ! [[ "$(cat sha-windows-x64)" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::checksum for windows-x64 not a 64-char hex digest: $(cat sha-windows-x64)"
            exit 1
          fi
          curl -sL --fail --retry 6 --retry-delay 5 --retry-all-errors \
            "${TAG_URL}/agent-shim-windows-arm64.zip.sha256" | awk '{print $1}' > sha-windows-arm64
          if ! [[ "$(cat sha-windows-arm64)" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::checksum for windows-arm64 not a 64-char hex digest: $(cat sha-windows-arm64)"
            exit 1
          fi

      - name: Generate manifest
        env:
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          WINDOWS_SHA=$(cat sha-windows-x64)
          WINDOWS_ARM_SHA=$(cat sha-windows-arm64)
          mkdir -p bucket
          cat > bucket/agent-shim.json <<EOF
          {
              "version": "${VERSION}",
              "description": "Profile manager and launcher for Claude Code with per-directory sharing rules",
              "homepage": "https://github.com/ExaDev/agent-shim",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/ExaDev/agent-shim/releases/download/${TAG}/agent-shim-windows-x64.zip",
                      "hash": "${WINDOWS_SHA}"
                  },
                  "arm64": {
                      "url": "https://github.com/ExaDev/agent-shim/releases/download/${TAG}/agent-shim-windows-arm64.zip",
                      "hash": "${WINDOWS_ARM_SHA}"
                  }
              },
              "bin": [
                  "agent-shim.exe",
                  [
                      "agent-shim.exe",
                      "claude-use"
                  ]
              ],
              "checkver": {
                  "github": "https://github.com/ExaDev/agent-shim"
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/ExaDev/agent-shim/releases/download/v\$version/agent-shim-windows-x64.zip"
                      },
                      "arm64": {
                          "url": "https://github.com/ExaDev/agent-shim/releases/download/v\$version/agent-shim-windows-arm64.zip"
                      }
                  }
              }
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/agent-shim.json
          git diff --cached --quiet || git commit -m "chore: update manifest to ${{ needs.semantic-release.outputs.tag }}"
          git push

  verify-tap-macos:
    name: Verify Homebrew install (macOS)
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release, update-tap]
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.semantic-release.outputs.tag }}
    steps:
      - name: Tap and install
        run: |
          brew tap ExaDev/agent-shim
          brew install ExaDev/agent-shim/agent-shim
      - name: Check installed version matches the tag
        run: |
          agent-shim --version
          INSTALLED=$(agent-shim --version)
          EXPECTED="${RELEASE_TAG#v}"
          if [ "$INSTALLED" != "$EXPECTED" ]; then
            echo "version mismatch: installed=$INSTALLED expected=$EXPECTED"
            exit 1
          fi
      - name: Confirm claude is not installed by default
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should not be on PATH after a fresh install -- found $(command -v claude)"
            exit 1
          fi
      - name: shim enable/disable round-trip
        run: |
          agent-shim shim enable
          # This runner has no real downstream Claude Code install, so invoking `claude` -- which always forwards straight into the launcher pipeline, never special-casing --version -- deterministically fails at binary discovery. That failure is itself the proof the shim file exists, is executable, and correctly dispatches into the launcher rather than crashing for some unrelated reason.
          if claude --version 2>err.log; then
            echo "error: 'claude' should not have found a downstream Claude Code binary in this CI environment"
            exit 1
          fi
          if ! grep -qi "Could not find a claude binary" err.log; then
            echo "error: 'claude' failed for an unexpected reason:"
            cat err.log
            exit 1
          fi
          agent-shim shim disable
          # bash caches a resolved command's path in its hash table the first time it's invoked in this shell session (here, by the `claude --version` call above) -- command -v/type check that cache before the filesystem, so without clearing it a just-deleted file can still be reported as found.
          hash -r
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should be gone after shim disable -- found $(command -v claude)"
            exit 1
          fi

  # macOS x64's Node SEA binary segfaults on every invocation (a known, unfixed upstream Node bug -- see docs/release-process.md's "Build (Node SEA)" section) so the Homebrew formula installs via npm + a Homebrew-managed Node for this one architecture instead (see update-tap's own Generate formula step) -- the same code this project already publishes and verifies on the npm channel elsewhere, not the broken SEA binary. That makes this a normal, blocking verify job like every other channel: a failure here is a real bug in this project's own npm-wrapped formula, not Node's upstream SEA limitation.
