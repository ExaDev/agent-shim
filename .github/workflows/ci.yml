  verify-scoop:
    name: Verify Scoop install (${{ matrix.os }})
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release, update-scoop]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.semantic-release.outputs.tag }}
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\scoop\shims\scoop.ps1")) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"
      - name: Add bucket and install
        shell: pwsh
        run: |
          if (-not (scoop bucket list | Select-String -Quiet '^agent-shim')) {
            scoop bucket add agent-shim https://github.com/ExaDev/scoop-agent-shim
          }
          scoop install agent-shim
      - name: Check installed version matches the tag
        shell: pwsh
        run: |
          $installed = agent-shim --version
          Write-Host $installed
          $expected = $env:RELEASE_TAG -replace '^v', ''
          if ($installed -ne $expected) {
            Write-Host "version mismatch: installed=$installed expected=$expected"
            exit 1
          }
      - name: Confirm claude is not installed by default
        shell: pwsh
        run: |
          if (Get-Command claude -ErrorAction SilentlyContinue) {
            Write-Host "error: 'claude' should not be on PATH after a fresh install"
            exit 1
          }
      - name: shim enable/disable round-trip
        shell: pwsh
        run: |
          agent-shim shim enable
          # This runner has no real downstream Claude Code install, so invoking `claude` -- which always forwards straight into the launcher pipeline, never special-casing --version -- deterministically fails at binary discovery. That failure is itself the proof the shim file exists, is executable, and correctly dispatches into the launcher rather than crashing for some unrelated reason.
          $output = claude --version 2>&1 | Out-String
          Write-Host "claude --version exit code: $LASTEXITCODE"
          Write-Host "claude --version output: $output"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "error: 'claude' should not have found a downstream Claude Code binary in this CI environment"
            exit 1
          }
          if ($output -notmatch '(?i)Could not find a claude binary') {
            Write-Host "error: 'claude' failed for an unexpected reason:"
            Write-Host $output
            exit 1
          }
          agent-shim shim disable
          if (Get-Command claude -ErrorAction SilentlyContinue) {
            Write-Host "error: 'claude' should be gone after shim disable"
            exit 1
          }

  # Confirms `npx agent-shim` genuinely works post-publish, on all three platforms — unlike the Homebrew/Scoop verify jobs above, this one channel is meant to work everywhere, so it gets a matrix rather than one job per OS. GitHub-hosted Windows runners ship Git Bash, so `shell: bash` here needs no PowerShell-specific branching.
  verify-npm:
    name: Verify npm install (${{ matrix.os }})
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release, publish-npm]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.semantic-release.outputs.tag }}
    steps:
      - name: Run via npx and check version
        shell: bash
        run: |
          expected="${RELEASE_TAG#v}"
          # npm's package metadata and its tarball blob storage are separate backing stores, and the metadata can resolve a version well before the tarball itself is downloadable -- confirmed directly, not theoretical: this gap has outlasted a much narrower budget here before, on a publish the registry's own status page reported no incident for. Retry generously (60 attempts, ~10 minutes) rather than trusting the first attempt.
          #
          # Uses `-p ... agent-shim` (the explicit command form) rather than the bare `npx agent-shim@version` form: empirically, npm 11.17's bare-invocation heuristic for a multi-bin package picks the wrong bin (`claude`, not `agent-shim`) even though npm's own documented rule says it should match the bin named after the package. The explicit form isn't ambiguous in the first place, so it isn't exposed to that bug.
          installed=""
          for i in $(seq 1 60); do
            if installed=$(npx --yes -p "agent-shim@${expected}" agent-shim --version 2>/dev/null); then
              break
            fi
            echo "npm registry not ready yet, retrying in 10s... ($i/60)"
            sleep 10
          done
          echo "$installed"
          if [ "$installed" != "$expected" ]; then
            echo "version mismatch: installed=$installed expected=$expected"
            exit 1
          fi
      # npx alone doesn't leave a stable, PATH-visible agent-shim for a shim to attach to -- a real global install is needed for the round-trip below, distinct from the ephemeral npx invocation just proven above.
      - name: Global install for the shim round-trip
        shell: bash
        run: npm install -g "agent-shim@${RELEASE_TAG#v}"
      - name: Confirm claude is not installed by default
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should not be on PATH after a fresh install -- found $(command -v claude)"
            exit 1
          fi
      # On macOS/Linux, an npm install's own dist/cli.cjs is directly executable via its shebang once hardlinked to a bare `claude`, so shim enable should succeed there. On Windows, an npm-installed agent-shim runs under Node with no bundled .exe and no shebang-based dispatch, so shim enable must refuse with a clear error instead of producing a broken file -- both branches are asserted, not just hoped for.
      - name: shim enable/disable round-trip (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          agent-shim shim enable
          # This runner has no real downstream Claude Code install, so invoking `claude` -- which always forwards straight into the launcher pipeline, never special-casing --version -- deterministically fails at binary discovery. That failure is itself the proof the shim file exists, is executable, and correctly dispatches into the launcher rather than crashing for some unrelated reason.
          if claude --version 2>err.log; then
            echo "error: 'claude' should not have found a downstream Claude Code binary in this CI environment"
            exit 1
          fi
          if ! grep -qi "Could not find a claude binary" err.log; then
            echo "error: 'claude' failed for an unexpected reason:"
            cat err.log
            exit 1
          fi
          agent-shim shim disable
          # bash caches a resolved command's path in its hash table the first time it's invoked in this shell session (here, by the `claude --version` call above) -- command -v/type check that cache before the filesystem, so without clearing it a just-deleted file can still be reported as found.
          hash -r
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should be gone after shim disable -- found $(command -v claude)"
            exit 1
          fi
      - name: shim enable correctly refuses (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if agent-shim shim enable 2>err.log; then
            echo "error: shim enable should have refused on an npm-on-Windows install"
            exit 1
          fi
          if ! grep -qi "Cannot create a working" err.log; then
            echo "error: refused for an unexpected reason:"
            cat err.log
            exit 1
          fi

  # There is no other CI coverage of install.sh itself at all -- every other verify job exercises a package manager's own install mechanism, never the plain curl script most users will actually run first.
  verify-install-script:
    name: Verify install.sh (${{ matrix.os }})
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.semantic-release.outputs.tag }}
    steps:
      - name: Download and run install.sh into a scratch directory
        run: |
          scratch_dir="$RUNNER_TEMP/agent-shim-install-test"
          mkdir -p "$scratch_dir"
          AGENT_SHIM_INSTALL_DIR="$scratch_dir" sh -c "$(curl -fsSL "https://github.com/ExaDev/agent-shim/releases/download/${RELEASE_TAG}/install.sh")"
