          hash -r
          if command -v claude >/dev/null 2>&1; then
            echo "error: 'claude' should be gone after shim disable -- found $(command -v claude)"
            exit 1
          fi

  verify-tap-linux:
    name: Verify Homebrew install (Linux, ${{ matrix.os }})
    if: needs.semantic-release.outputs.published == 'true' && needs.release.result == 'success'
    needs: [semantic-release, release, update-tap]
    strategy:
      fail-fast: false
      matrix:
