name: Rebase when behind

on:
  push:
    branches: [main]

# One run at a time, and a newer push to main supersedes a queued one: the run reads every open pull request afresh.
concurrency:
  group: rebase-when
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action rebases in a fresh repository holding only fetched commits, so none of a pull request's code runs here.
      - uses: ExaDev/merge-when@v1
        with:
          then: rebase
          ssh-key: ${{ secrets.MERGE_DEPLOY_KEY }}
          when: |
            label: automerge
            behind
