name: Merge when green

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]

concurrency:
  group: merge-when-green-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  merge:
    # A CI run counts when a pull request's own event started it, or when it was dispatched on a `claude-code-verified/` branch of this repository: the daily Claude Code versions job pushes that branch and opens its pull request with the workflow's token, which starts no workflow, so it dispatches CI instead, and that run's event is `workflow_dispatch`.
    # The dispatched case widens nothing. Only someone with write access to this repository (or a workflow run in it with `contents: write`) can create a branch here or dispatch a workflow, and write access includes the triage access that labelling a pull request needs; a fork's branch of the same name is refused by the repository check. Whatever started the run, the action still merges only the open pull request whose head is that run's commit, and only while it carries the label, has the required check passing on that commit, is not a draft and has no unresolved thread.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.event == 'pull_request'
          || (github.event.workflow_run.event == 'workflow_dispatch'
            && startsWith(github.event.workflow_run.head_branch, 'claude-code-verified/')
            && github.event.workflow_run.head_repository.full_name == github.repository)))
      || (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: running none of the pull request's code is what makes the pull_request_target trigger safe.
      - uses: ExaDev/merge-when-green@v1
        with:
          merge-method: fast-forward
          ssh-key: ${{ secrets.MERGE_DEPLOY_KEY }}
          update-behind: true
          required-check: Required checks
