version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The Rust workspace's lock file and its toolchain pin, with the same release-age cooldown the npm entry uses. The cargo-deny version the workflows install is outside both ecosystems, and scripts/check-tool-pins.py checks it against the same cooldown on a schedule.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "rust-toolchain"
    directory: "/rust"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
